[project]
name = "brailliant"
version = "0.1.0"
description = "Create sparklines and terminal images with Braille Unicode characters."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "Pedro Batista", email = "pedrovhb@gmail.com" }]
dependencies = [
    "asynkets==0.1.4",
    "bitarray>=2.7.3,<3.0.0",
    "bitstring>=4.0.1,<5.0.0",
    "exceptiongroup>=1.1.0,<2.0.0",
    "pillow>=10.0.0,<12.0.0",
    "rich>=13.3.1,<14.0.0",
]

[project.scripts]
brailliant = "brailliant.cli:display_braille_media"
br = "brailliant.cli:display_braille_media"
bspark = "brailliant.cli:display_sparkline"

[dependency-groups]
dev = [
    "black[d]>=23.1.0,<24.0.0",
    "ipython>=8.10.0,<9.0.0",
    "mypy>=0.991,<1.0.0",
    "pytest>=7.2.1,<8.0.0",
    "pytest-benchmark>=4.0.0,<6.0.0",
    "scalene>=1.5.16,<2.0.0",
    "usort>=1.0.5,<2.0.0",
    "vprof>=0.38,<1.0.0",
]
examples = [
    "astream==0.7.3",
    "pymunk>=6.4.0,<7.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brailliant"]
