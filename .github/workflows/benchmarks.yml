name: Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          uv run python scripts/run_benchmarks.py --source-root . --output .benchmarks/head.json

      - name: Prepare base worktree
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add ../brailliant-base "origin/${{ github.base_ref }}"

      - name: Run base branch benchmarks
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .benchmarks
          uv run python scripts/run_benchmarks.py --source-root ../brailliant-base --output .benchmarks/base.json

      - name: Compare benchmark results
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/compare_benchmarks.py \
            --base .benchmarks/base.json \
            --head .benchmarks/head.json \
            --base-label "${{ github.base_ref }}" \
            --head-label "${{ github.head_ref || github.sha }}" \
            --markdown .benchmarks/comment.md

      - name: Comment benchmark comparison on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-report -->';
            const path = '.benchmarks/comment.md';
            if (!fs.existsSync(path)) {
              core.info('No benchmark comment generated.');
              return;
            }

            const body = fs.readFileSync(path, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-benchmark-${{ github.sha }}
          path: .benchmarks/
