name: Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          uv run pytest benchmarks -q --benchmark-only --benchmark-sort=mean --benchmark-json .benchmarks/pytest-benchmark.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-benchmark-${{ github.sha }}
          path: .benchmarks/pytest-benchmark.json
